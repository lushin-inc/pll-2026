<style>
  :root{
    --bg:#f5f6f8;
    --panel:#ffffff;
    --panel-2:#eef1f4;
    --ink:#17212b;
    --ink-soft:rgba(23,33,43,.62);
    --ink-faint:rgba(23,33,43,.4);
    --line:rgba(23,33,43,.08);
    --bar-track:rgba(23,33,43,.06);
    --nav-bg:#ffffff;
    --row-shadow:0 1px 3px rgba(23,33,43,.04);
    --focus:#17212b;
    --radius:14px;
    --nav-w:216px;
    --nav-w-min:62px;
  }
  html[data-theme="dark"]{
    --bg:#0e1215;
    --panel:#161c21;
    --panel-2:#1c242b;
    --ink:#f2f5f7;
    --ink-soft:rgba(242,245,247,.62);
    --ink-faint:rgba(242,245,247,.38);
    --line:rgba(255,255,255,.07);
    --bar-track:rgba(255,255,255,.06);
    --nav-bg:#121820;
    --row-shadow:none;
    --focus:#f2f5f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}

  /* ---- Side nav ---- */
  .sidenav{
    position:fixed;top:0;left:0;bottom:0;z-index:20;
    width:var(--nav-w);
    background:var(--nav-bg);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    padding:14px 10px;
    transition:width .2s ease;
    overflow:hidden;
  }
  body.nav-min .sidenav{width:var(--nav-w-min)}

  .nav-top{display:flex;align-items:center;gap:8px;margin-bottom:14px;min-height:42px}
  .nav-toggle{
    flex:0 0 42px;height:42px;border-radius:10px;border:none;background:transparent;
    color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .nav-toggle:hover{background:var(--panel-2);color:var(--ink)}
  .nav-toggle:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .nav-brand{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;opacity:1;transition:opacity .15s;
  }
  body.nav-min .nav-brand{opacity:0;pointer-events:none}

  .nav-links{display:flex;flex-direction:column;gap:4px;flex:1}
  .nav-link{
    display:flex;align-items:center;gap:12px;
    padding:11px 11px;border-radius:10px;
    color:var(--ink-soft);font-size:14px;font-weight:600;
    white-space:nowrap;position:relative;
  }
  .nav-link:hover{background:var(--panel-2);color:var(--ink)}
  .nav-link:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .nav-link.here{color:var(--ink);background:var(--panel-2)}
  .nav-link.here::before{
    content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;
    background:var(--here-grad,var(--ink));
  }
  .nav-ico{
    flex:0 0 22px;height:22px;display:flex;align-items:center;justify-content:center;
  }
  .nav-ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nav-label{opacity:1;transition:opacity .15s}
  body.nav-min .nav-label{opacity:0;pointer-events:none}

  .theme-btn{
    display:flex;align-items:center;gap:12px;
    padding:11px;border-radius:10px;border:none;background:transparent;cursor:pointer;
    color:var(--ink-soft);font-size:14px;font-weight:600;white-space:nowrap;text-align:left;
  }
  .theme-btn:hover{background:var(--panel-2);color:var(--ink)}
  .theme-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .theme-btn .nav-ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* ---- Mobile top bar + drawer scrim (both hidden on desktop) ---- */
  .topbar{display:none}
  .scrim{display:none}

  /* ---- Main ---- */
  .main{
    margin-left:var(--nav-w);
    padding:28px 20px 64px;
    transition:margin-left .2s ease;
  }
  body.nav-min .main{margin-left:var(--nav-w-min)}
  .wrap{max-width:880px;margin:0 auto}

  .page-title{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;
    letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:24px;
  }

  /* ---- Hub tiles ---- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .tile{
    border-radius:18px;min-height:230px;display:flex;flex-direction:column;justify-content:flex-end;
    padding:24px;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .18s;color:#fff;
  }
  .tile:hover{transform:translateY(-3px)}
  .tile:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .tile-eyebrow{font-size:14px;font-weight:500;opacity:.85;margin-bottom:6px}
  .tile-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:46px;line-height:1;text-transform:uppercase;letter-spacing:.02em}

  /* ---- Section header ---- */
  .sec-head{border-radius:18px;padding:22px 24px;margin-bottom:22px;color:#fff}
  .sec-eyebrow{font-size:13px;font-weight:500;opacity:.85}
  .sec-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:38px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;margin-top:4px}

  /* ---- Controls ---- */
  .sort-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .sort-btn{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase;
    padding:12px 18px;border-radius:10px;border:1px solid var(--line);cursor:pointer;
    background:var(--panel);color:var(--ink-soft);transition:background .15s,color .15s;
  }
  .sort-btn:hover{background:var(--panel-2);color:var(--ink)}
  .sort-btn.active{border-color:transparent;box-shadow:0 4px 18px var(--glow)}
  .sort-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  .filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .team-btn{
    display:inline-flex;align-items:center;gap:7px;
    font-size:12px;font-weight:600;padding:6px 13px 6px 7px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);transition:all .15s;
  }
  .team-btn:hover{color:var(--ink)}
  .team-btn.active{color:#fff;border-color:transparent}
  .team-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  .pool-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
  .pool-btn{
    font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);transition:all .15s;
  }
  .pool-btn:hover{color:var(--ink)}
  .pool-btn.active{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
  .pool-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  /* ---- Rows ---- */
  .board{display:flex;flex-direction:column;gap:10px}
  .row{
    background:var(--panel);border-radius:var(--radius);padding:16px 18px;cursor:pointer;
    position:relative;overflow:hidden;transition:background .15s;
    border:1px solid var(--line);box-shadow:var(--row-shadow);
  }
  .row:hover{background:var(--panel-2)}
  .row:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .row.top{border-color:var(--accent-line)}

  .row-main{display:grid;grid-template-columns:34px 34px 1fr auto;gap:12px;align-items:center;position:relative;z-index:1}
  .rank{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;color:var(--ink-faint);text-align:center}
  .row.top .rank{color:var(--accent-ink)}
  .who{min-width:0}
  .gname{font-weight:600;font-size:16.5px;line-height:1.2}
  .gmeta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
  .team-chip{font-size:11px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:6px;color:#fff}
  .rk-chip{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;padding:2px 6px;border-radius:5px;
    color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent-line)}
  .pos-chip{font-size:11px;font-weight:600;letter-spacing:.05em;padding:3px 8px;border-radius:6px;background:var(--panel-2);color:var(--ink-soft)}
  .gp{font-size:12px;color:var(--ink-faint)}
  .stat{text-align:right}
  .stat-val{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
  .row.top .stat-val{color:var(--accent-ink)}
  .stat-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:4px}

  .fill-track{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--bar-track)}
  .fill{position:absolute;left:0;bottom:0;height:4px;background:var(--accent-grad);border-radius:0 3px 3px 0;transition:width .5s cubic-bezier(.22,1,.36,1)}

  .detail{
    display:none;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
    grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px;
  }
  .row.open .detail{display:grid}
  .d-val{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
  .d-label{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px}

  /* ---- Standings ---- */
  .conf-title{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-soft);margin:22px 0 10px;
  }
  .conf-title:first-of-type{margin-top:0}
  .st-row{cursor:default}
  .st-row:hover{background:var(--panel)}
  .st-main{display:grid;grid-template-columns:26px 46px 1fr auto;gap:12px;align-items:center;position:relative;z-index:1}
  .st-stats{display:flex;gap:20px;align-items:baseline;text-align:right}
  .st-rec{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
  .st-cell{min-width:44px}
  .st-cell .d-val{font-size:19px}
  .sd-pos{color:var(--sd-pos,#1d7a3e)}
  .sd-neg{color:var(--sd-neg,#c22e2e)}
  html[data-theme="dark"]{--sd-pos:#4fc276;--sd-neg:#f0716a}

  .note{margin-top:22px;font-size:12.5px;color:var(--ink-faint);line-height:1.5}

  /* ---- Logos ---- */
  .lg{width:34px;height:34px;object-fit:contain;display:block;flex:0 0 auto}
  .lg-lg{width:46px;height:46px}
  .lg-sm{width:26px;height:26px}
  .lg-xs{width:19px;height:19px}
  .tname{font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--ink-soft)}
  .tile-logos{display:flex;gap:5px;margin-bottom:12px}
  .tile-logos .lg{width:27px;height:27px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
  .head-logo{position:absolute;right:20px;top:50%;transform:translateY(-50%);opacity:.9}
  .head-logo .lg{width:64px;height:64px}
  .sec-head{position:relative}

  /* ---- Team game log ---- */
  .form{display:flex;gap:3px;margin-top:7px}
  .pip{width:15px;height:5px;border-radius:3px;background:var(--bar-track)}
  .pip-w{background:var(--sd-pos,#1d7a3e)}
  .pip-l{background:var(--sd-neg,#c22e2e)}
  .st-row{cursor:pointer}
  .st-row:hover{background:var(--panel-2)}
  .gl{display:flex;flex-direction:column}
  .gl-g{display:grid;grid-template-columns:60px 24px 1fr auto;gap:11px;align-items:center;
    padding:10px 2px;border-bottom:1px solid var(--line)}
  .gl-g:last-of-type{border-bottom:none}
  .gl-d{font-size:11.5px;color:var(--ink-faint);white-space:nowrap}
  .gl-r{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;
    width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff}
  .gl-w{background:var(--sd-pos,#1d7a3e)}
  .gl-l{background:var(--sd-neg,#c22e2e)}
  .gl-o{display:flex;align-items:center;gap:9px;min-width:0;font-size:14.5px;font-weight:600}
  .gl-o span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gl-s{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .gl-ot{font-size:9.5px;letter-spacing:.07em;color:var(--ink-faint);margin-left:5px}
  .gl-sum{display:flex;gap:20px;flex-wrap:wrap;padding:12px 2px 2px;font-size:12px;color:var(--ink-faint)}
  .gl-sum b{font-family:'Barlow Condensed',sans-serif;font-size:16px;color:var(--ink);font-weight:700}

  /* ---- Avatars & crests ---- */
  .av{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:block;object-fit:cover;
    background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--av-tint,var(--line))}
  .av-mono{display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;letter-spacing:.03em;
    color:#fff;background:var(--av-tint,#5a6472);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14)}
  .av-sm{width:34px;height:34px}.av-sm.av-mono{font-size:13px}
  .av-lg{width:96px;height:96px}.av-lg.av-mono{font-size:36px}
  .av-xl{width:132px;height:132px}.av-xl.av-mono{font-size:50px}
  .crest{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11.5px;
    letter-spacing:.02em;background:var(--cr-bg);color:var(--cr-ink);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .crest-lg{width:46px;height:46px;font-size:15px}
  .crest-sm{width:26px;height:26px;font-size:9.5px}

  /* ---- Team page ---- */
  .tm-pick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px;align-items:center}
  .tm-all{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;padding:0 14px;height:46px;
    border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);cursor:pointer}
  .tm-all:hover{background:var(--panel-2);color:var(--ink)}
  .tm-all.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-ink)}
  .tm-all:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .tm-btn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
    cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s,border-color .15s}
  .tm-btn:hover{background:var(--panel-2)}
  .tm-btn.on{border-color:var(--accent-line);background:var(--accent-soft)}
  .tm-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .tm-btn .lg{width:32px;height:32px}

  .tm-card{background:var(--panel);border:1px solid var(--accent-line);border-radius:18px;
    padding:20px 22px;box-shadow:var(--row-shadow)}
  .tm-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:14px}
  .tm-nums .d-val{font-size:27px}
  .tm-lead{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;
    margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .tm-lead-v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;line-height:1.15}
  .tm-lead-v b{color:var(--accent-ink);font-weight:700}
  .tm-grp{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--ink-faint);margin:22px 0 9px}
  .tm-row .row-main{grid-template-columns:1fr auto}
  .tm-late{color:var(--accent-ink)}
  .tm-rank{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);margin-top:3px}

  /* ---- Rookie board ---- */
  .rb-row{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 16px;display:grid;grid-template-columns:46px 44px 1fr auto;gap:14px;align-items:center;
    box-shadow:var(--row-shadow);cursor:pointer;text-decoration:none;color:inherit}
  .rb-row:hover{background:var(--panel-2);border-color:var(--accent-line)}
  .rb-row:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .rb-pick{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:23px;line-height:1;
    text-align:center;color:var(--accent-ink);font-variant-numeric:tabular-nums}
  .rb-pick small{display:block;font-size:9px;letter-spacing:.08em;color:var(--ink-faint);
    text-transform:uppercase;margin-top:3px;font-family:'Inter',sans-serif;font-weight:600}
  .rb-nm{font-weight:600;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
  .rb-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px;
    font-size:12px;color:var(--ink-faint)}
  .rb-right{display:flex;align-items:center;gap:12px}
  .rb-stat{text-align:right;min-width:52px}
  .rb-stat .st-rec{font-size:21px}
  .und{color:var(--accent-ink);font-weight:700;font-size:13px}

  /* ---- ROY watch ---- */
  .roy-lead{background:var(--panel);border:1px solid var(--accent-line);border-radius:18px;
    padding:22px;box-shadow:var(--row-shadow);display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
  .roy-lead .kicker{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
  .roy-nm{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:38px;line-height:1;
    margin:6px 0 9px;overflow-wrap:anywhere}
  .roy-line{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
  .roy-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:17px 18px;box-shadow:var(--row-shadow);margin-bottom:11px}
  .roy-hd>div{min-width:0}

const isRookie = p => p.n in ROOKIES;
const rookieTag = n => {
  const r = ROOKIES[n]; if (!r) return "";
  return r.pick ? `2026 draft \u00b7 Rd ${r.rnd}, No. ${r.pick} overall \u00b7 ${r.school}`
                : `2026 rookie \u00b7 ${r.path} \u00b7 ${r.school}`;
};

// Initials for the monogram fallback: first letter of the first and last name.
function initials(n){
  const parts = n.trim().split(/\s+/);
  return ((parts[0][0]||"") + (parts.length>1 ? parts[parts.length-1][0] : "")).toUpperCase();
}

// A player's face: real photo when one is configured, otherwise a monogram
// tinted with his team's colour. Same box either way, so layout never shifts.
function avatar(p, cls){
  const tc = TEAM_COLORS[p.t] || "#555";
  const src = PHOTOS[p.n];
  if (src) return `<img class="av ${cls||''}" src="${src}" alt="${p.n}" loading="lazy"
     style="--av-tint:${tc}" onerror="this.replaceWith(monoNode('${p.n.replace(/'/g,"\\'")}','${tc}','${cls||''}'))">`;
  return `<span class="av av-mono ${cls||''}" style="--av-tint:${tc}" aria-hidden="true">${initials(p.n)}</span>`;
}
function monoNode(name, tc, cls){
  const s = document.createElement("span");
  s.className = "av av-mono " + (cls||"");
  s.style.setProperty("--av-tint", tc);
  s.textContent = name.trim().split(/\s+/).map((x,i,a)=>(i===0||i===a.length-1)?x[0]:"").join("").toUpperCase();
  return s;
}

// School crest: a coloured disc with the school's short form.
function crest(school, cls){
  const s = SCHOOLS[school];
  if (!s) return `<span class="crest ${cls||''}" style="--cr-bg:#5a6472;--cr-ink:#fff" title="${school}">?</span>`;
  return `<span class="crest ${cls||''}" style="--cr-bg:${s[1]};--cr-ink:${s[2]}" title="${school}">${s[0]}</span>`;
}

// Every game a team has played, oldest first, from that team's point of view.
function teamGames(team){
  return GAMES.filter(g=>g.w===team||g.l===team).map(g=>{
    const won = g.w===team;
    return {d:g.d, won, opp:won?g.l:g.w, gf:won?g.ws:g.ls, ga:won?g.ls:g.ws, ot:!!g.ot};
  });
}

// Standings line + conference placing for one team.
function teamInfo(team){
  for (const key of ["eastern","western"]){
    const i = STANDINGS[key].findIndex(r=>r.team===team);
    if (i>=0) return {...STANDINGS[key][i], conf: key==="eastern"?"Eastern":"Western", rank:i+1};
  }
  return null;
}

// Results including anything that landed after the standings cutoff (flagged).
function teamGamesAll(team){
  return GAMES.concat(LATE.map(g=>({...g, late:1})))
    .filter(g=>g.w===team||g.l===team)
    .map(g=>{ const won=g.w===team;
      return {d:g.d, won, opp:won?g.l:g.w, gf:won?g.ws:g.ls, ga:won?g.ls:g.ws, ot:!!g.ot, late:!!g.late}; })
    .sort((x,y)=> x.d<y.d ? -1 : 1);
}

// Every meeting between two teams, played and scheduled.
function series(a, b){
  const played = GAMES.concat(LATE.map(g=>({...g, late:1})))
    .filter(g=>(g.w===a&&g.l===b)||(g.w===b&&g.l===a))
    .map(g=>({d:g.d, winner:g.w, ot:!!g.ot, late:!!g.late,
              af:g.w===a?g.ws:g.ls, bf:g.w===b?g.ws:g.ls}))
    .sort((x,y)=> x.d<y.d ? -1 : 1);
  const next = UPCOMING.filter(u=>(u.a===a&&u.b===b)||(u.a===b&&u.b===a));
  const aw = played.filter(g=>g.winner===a).length;
  return {played, next, aw, bw:played.length-aw,
          af:played.reduce((n,g)=>n+g.af,0), bf:played.reduce((n,g)=>n+g.bf,0)};
}

// ---- Preferences (theme + nav), guarded so they degrade gracefully ----
function loadPref(key, fallback){
  try{ const v = localStorage.getItem(key); return v===null ? fallback : v; }catch(e){ return fallback; }
}
function savePref(key, val){
  try{ localStorage.setItem(key, val); }catch(e){}
}

let theme = loadPref("pll-theme","light");
let navMin = loadPref("pll-nav","open")==="min";

const view = document.getElementById("view");
const navLinks = document.getElementById("navLinks");
const themeBtn = document.getElementById("themeBtn");
const themeIco = document.getElementById("themeIco");
const themeLabel = document.getElementById("themeLabel");
const navToggle = document.getElementById("navToggle");
const mobileMenu = document.getElementById("mobileMenu");
const scrim = document.getElementById("scrim");

const isMobile = () => window.matchMedia("(max-width:760px)").matches;
// The drawer always starts closed on a phone, whatever the saved desktop preference is.
if (isMobile()) navMin = true;

function applyTheme(){
  document.documentElement.setAttribute("data-theme", theme);
  themeIco.innerHTML = theme==="light" ? ICONS.moon : ICONS.sun;
  themeLabel.textContent = theme==="light" ? "Dark mode" : "Light mode";
}
function applyNav(){
  document.body.classList.toggle("nav-min", navMin);
  // on mobile this class slides the whole drawer in; on desktop it just widens the rail
  const open = !navMin;
  document.body.classList.toggle("nav-open", open);
  navToggle.setAttribute("aria-label", navMin ? "Expand navigation" : "Collapse navigation");
  if (mobileMenu){
    mobileMenu.setAttribute("aria-expanded", String(open && isMobile()));
    mobileMenu.setAttribute("aria-label", open ? "Close navigation" : "Open navigation");
  }
  if (scrim) scrim.hidden = !isMobile();
  // stop the page scrolling behind an open drawer
  document.body.style.overflow = (open && isMobile()) ? "hidden" : "";
}

function setNav(open){
  navMin = !open;
  // a phone toggle shouldn't overwrite the desktop rail preference
  if (!isMobile()) savePref("pll-nav", navMin ? "min" : "open");
  applyNav();
}

function accentInk(s){ return theme==="dark" ? s.accentDark : s.accent; }

function currentRoute(){
  const h = (location.hash||"#home").slice(1);
  if (h.startsWith("player/")) return "player";
  return SECTIONS[h] ? h : "home";
}
function routePlayer(){
  const h = (location.hash||"").slice(1);
  return h.startsWith("player/") ? decodeURIComponent(h.slice(7)) : null;
}

  const items = [{key:"home",name:"Home",ico:"home",grad:null}]
    .concat(ORDER.map(k=>({key:k,name:SECTIONS[k].name,ico:SECTIONS[k].ico,grad:SECTIONS[k].grad})));

    <a class="nav-link ${route===it.key?'here':''}" href="#${it.key}" ${it.grad&&route===it.key?`style="--here-grad:${it.grad}"`:''} title="${it.name}">
      <span class="nav-ico">${ICONS[it.ico]}</span>
      <span class="nav-label">${it.name}</span>
    </a>`).join("");
}

            : k==="rookies" ? `<div class="tile-logos">${["Duke","Syracuse","Princeton","Harvard"].map(x=>crest(x,'lg-xs')).join("")}</div>`
            : k==="roy" ? `<div class="tile-logos">${ROY.slice(0,3).map(r=>avatar(PLAYERS.find(p=>p.n===r.n),'av-sm')).join("")}</div>`
            : k==="h2h" ? `<div class="tile-logos">${logo(state.h2h.a)}${logo(state.h2h.b)}</div>`
            : k==="kirst" ? `<div class="tile-logos">${logo("Waterdogs")}</div>` : ''}

      }).join("")}
    </div>`;
}

function gameLog(team){
  const gs = teamGamesAll(team);
  const gf = gs.reduce((n,g)=>n+g.gf,0), ga = gs.reduce((n,g)=>n+g.ga,0);
  return `<div class="gl">
    ${gs.map(g=>`
      <div class="gl-g">
        <div class="gl-d">${shortDate(g.d)}</div>
        <div class="gl-r ${g.won?'gl-w':'gl-l'}">${g.won?'W':'L'}</div>
        <div class="gl-o">${logo(g.opp,'lg-sm')}<span>${g.opp}</span></div>
        <div class="gl-s">${g.gf}\u2013${g.ga}${g.ot?'<span class="gl-ot">OT</span>':''}${g.late?'<span class="gl-ot tm-late">NEW</span>':''}</div>
      </div>`).join("")}
    <div class="gl-sum">
      <div><b>${gs.length}</b> played</div>
      <div><b>${(gf/gs.length).toFixed(1)}</b> scored / game</div>
      <div><b>${(ga/gs.length).toFixed(1)}</b> allowed / game</div>
    </div>
  </div>`;
}

function standingsRows(rows){
  return `<div class="board">` + rows.map((t,i)=>{
    const sdCls = t.sd>0?"sd-pos":(t.sd<0?"sd-neg":"");
    const wp = (t.w+t.l)>0 ? t.w/(t.w+t.l) : 0;
    const form = teamGames(t.team);
    return `
    <div class="row st-row ${i===0?'top':''}" tabindex="0" data-tsel="${t.team}">
      <div class="st-main">
        <div class="rank">${i+1}</div>
        ${logo(t.team,'lg-lg')}
        <div class="who">
          <div class="gname">${t.city} ${t.team}</div>
          <div class="form" title="Oldest result on the left">
            ${form.map(g=>`<span class="pip ${g.won?'pip-w':'pip-l'}"></span>`).join("")}
          </div>
        </div>
        <div class="st-stats">
          <div class="st-cell"><div class="st-rec">${t.w}–${t.l}</div><div class="d-label">W–L</div></div>
          <div class="st-cell st-hide-sm"><div class="d-val">${t.s}</div><div class="d-label">Scores</div></div>
          <div class="st-cell st-hide-sm"><div class="d-val">${t.sa}</div><div class="d-label">Against</div></div>
          <div class="st-cell"><div class="d-val ${sdCls}">${t.sd>0?'+':''}${t.sd}</div><div class="d-label">Diff</div></div>
        </div>
      </div>
      <div class="fill-track"></div>
      <div class="fill" style="width:${(wp*100).toFixed(1)}%"></div>
    </div>`;
  }).join("") + `</div>`;
}

function sectionVars(s){
  return `--accent-ink:${accentInk(s)};--accent-soft:${s.accentSoft};--accent-line:${s.accentLine};--accent-grad:${s.grad};--glow:${s.glow}`;
}

function teamPicker(sel){
  return `<div class="tm-pick">
    <button class="tm-all ${sel?'':'on'}" data-tsel="all">All teams</button>
    ${TEAMS.map(t=>`<button class="tm-btn ${t===sel?'on':''}" data-tsel="${t}"

    </div>

function renderRookies(){
  const s = SECTIONS.rookies, st = state.rookies;
  const list = PLAYERS.filter(isRookie);
  const POS_ORDER = ["A","M","FO","LSM","SSDM","D","G"];
  const POS_NAME = {A:"Attack",M:"Midfield",FO:"Faceoff",LSM:"Long-Stick Midfield",
                    SSDM:"Short-Stick D-Midfield",D:"Defense",G:"Goalie"};
  let body = "";

  if (st.pool === "pick"){
    const sorted = list.slice().sort((a,b)=>{
      const x = ROOKIES[a.n].pick, y = ROOKIES[b.n].pick;
      if (x && y) return x-y;
      if (x) return -1;
      if (y) return 1;
      return a.n.localeCompare(b.n);
    });
    const drafted = sorted.filter(p=>ROOKIES[p.n].pick);
    const und = sorted.filter(p=>!ROOKIES[p.n].pick);
    let cur = 0;
    body = drafted.map(p=>{
      const rd = ROOKIES[p.n].rnd;
      const head = rd!==cur ? (cur=rd, `<div class="tm-grp">Round ${rd}</div>`) : "";
      return head + rookieRow(p);
    }).join("")
    + `<div class="tm-grp">Undrafted \u2014 ${und.length} made rosters</div>`
    + und.map(p=>rookieRow(p)).join("");
  }
  else if (st.pool === "pos"){
    body = POS_ORDER.map(pos=>{
      const g = list.filter(p=>p.p===pos)
        .sort((a,b)=>(ROOKIES[a.n].pick||99)-(ROOKIES[b.n].pick||99));
      if (!g.length) return "";
      return `<div class="tm-grp">${POS_NAME[pos]} \u2014 ${g.length}</div>` + g.map(p=>rookieRow(p)).join("");
    }).join("");
  }
  else if (st.pool === "school"){
    const by = {};
    list.forEach(p=>{ const sc = ROOKIES[p.n].school; (by[sc] = by[sc]||[]).push(p); });
    const keys = Object.keys(by).sort((a,b)=> by[b].length - by[a].length || a.localeCompare(b));
    body = keys.map(sc=>{
      const g = by[sc].sort((a,b)=>(ROOKIES[a.n].pick||99)-(ROOKIES[b.n].pick||99));
      return `<div class="tm-grp" style="display:flex;align-items:center;gap:9px">
        ${crest(sc,'crest-sm')} ${sc} \u2014 ${g.length}</div>` + g.map(p=>rookieRow(p)).join("");
    }).join("");
  }
  else {
    body = list.slice().sort((a,b)=>b.pts-a.pts || b.g-a.g).map(p=>rookieRow(p)).join("");
  }

  const schools = new Set(list.map(p=>ROOKIES[p.n].school));
  view.innerHTML = `
  <div style="${sectionVars(s)}">
    <div class="sec-head" style="background:${s.grad}">
      <div class="sec-eyebrow">${s.eyebrow}</div>
      <div class="sec-name">Rookies</div>
    </div>
    <div class="tm-nums" style="margin-bottom:20px">
      <div><div class="d-val">${list.length}</div><div class="d-label">Rookies</div></div>
      <div><div class="d-val">${list.filter(p=>ROOKIES[p.n].pick).length}</div><div class="d-label">Drafted</div></div>
      <div><div class="d-val">${list.filter(p=>!ROOKIES[p.n].pick).length}</div><div class="d-label">Undrafted</div></div>
      <div><div class="d-val">${schools.size}</div><div class="d-label">Schools</div></div>
      <div><div class="d-val">${list.reduce((n,p)=>n+p.pts,0)}</div><div class="d-label">Points</div></div>
    </div>
    <div class="pool-row">
      ${s.pools.map(x=>`<button class="pool-btn ${x.key===st.pool?'active':''}" data-pool="${x.key}">${x.label}</button>`).join("")}
    </div>
    <div class="board" style="gap:9px">${body}</div>
    <div class="note">
      Tap any rookie for his player page. The 2026 draft ran four rounds of eight picks on April 14;
      UDFA marks a player who went undrafted and still made a 25-man roster. School crests use each
      programme's colours. Stats through Fri, Jul 31.
    </div>
  </div>`;
}

  const tc = TEAM_COLORS[p.t];
  const vars = `--accent-ink:${tc};--accent-soft:${tc}1f;--accent-line:${tc}80;--glow:${tc}55`;
  const rk = ROOKIES[p.n];
  const GRP = {A:["Attack",FIELD_DETAIL,"pts","Points"],M:["Midfield",FIELD_DETAIL,"pts","Points"],
    FO:["Faceoff",FO_DETAIL,"fop","Faceoff %"],G:["Goalie",G_DETAIL,"svp","Save %"],
    D:["Defense",DEF_DETAIL,"ct","Caused TOs"],LSM:["Defense",DEF_DETAIL,"ct","Caused TOs"],
    SSDM:["Defense",DEF_DETAIL,"ct","Caused TOs"]}[p.p] || ["Player",FIELD_DETAIL,"pts","Points"];
  const peers = PLAYERS.filter(x=>x.p===p.p && x.gp>0).sort((a,b)=>b[GRP[2]]-a[GRP[2]]);
  const rank = peers.findIndex(x=>x.n===p.n)+1;
  const teamPeers = PLAYERS.filter(x=>x.t===p.t && x.gp>0).sort((a,b)=>b.pts-a.pts);
  const teamRank = teamPeers.findIndex(x=>x.n===p.n)+1;

  view.innerHTML = `
  <div style="${vars}">
    <a class="pp-back" href="#teams">\u2190 ${p.t}</a>
    <div class="pp-hd">
      ${avatar(p,'av-xl')}
      <div>
        <div class="pp-nm">${p.n}</div>
        <div class="pp-meta">
          ${logo(p.t,'lg-sm')}<span>${p.t}</span>
          <span class="pos-chip">${p.p}</span>
          <span>${p.gp} game${p.gp===1?'':'s'}</span>
          ${rk ? `${crest(rk.school,'crest-sm')}<span>${rk.school}</span>
                 <span class="rk-chip" title="${rookieTag(p.n)}">Rookie</span>` : ''}
        </div>
        ${rk ? `<div class="rb-meta" style="margin-top:11px">
          ${rk.pick ? `2026 draft \u00b7 Round ${rk.rnd}, No. ${rk.pick} overall`
                    : `2026 rookie \u00b7 ${rk.path}`}</div>` : ''}
      </div>
    </div>

    <div class="kw-sub">2026 season</div>
    <div class="pp-grid">
      ${GRP[1](p).map(([v,l])=>`<div><div class="d-val">${v}</div><div class="d-label">${l}</div></div>`).join("")}
    </div>

    ${p.gp ? `<div style="margin-top:16px" class="pp-rank">
      <b>${ord(rank)}</b> of ${peers.length} ${GRP[0].toLowerCase()} players league-wide by ${GRP[3].toLowerCase()},
      and <b>${ord(teamRank)}</b> on the ${p.t} in points.
      ${isRookie(p) ? (()=>{ const rr = PLAYERS.filter(isRookie).filter(x=>x.gp>0)
          .sort((a,b)=>b.pts-a.pts).findIndex(x=>x.n===p.n)+1;
          return ` Among rookies he ranks <b>${ord(rr)}</b> in points.`; })() : ''}
    </div>` : ''}

    <div class="kw-sub">${p.t} \u2014 rest of the roster</div>
    <div class="board" style="gap:8px">
      ${teamPeers.filter(x=>x.n!==p.n).slice(0,6).map(x=>`
        <a class="rb-row" href="${playerHref(x.n)}" style="grid-template-columns:44px 1fr auto">
          ${avatar(x,'av-sm')}
          <div><div class="rb-nm" style="font-size:15px">${x.n}</div>
            <div class="rb-meta"><span class="pos-chip">${x.p}</span>
              ${isRookie(x)?'<span class="rk-chip">Rookie</span>':''}
              <span>${x.gp} games</span></div></div>
          <div class="rb-stat"><div class="st-rec">${x.pts}</div><div class="d-label">Pts</div></div>
        </a>`).join("")}
    </div>
    <div class="note">Stats through Fri, Jul 31.</div>
  </div>`;
}

function renderH2H(){
  const s = SECTIONS.h2h;
  const st = state.h2h;
  const a = st.a, b = st.b;
  const S = series(a,b);
  const lead = S.aw>S.bw ? a : (S.bw>S.aw ? b : null);
  const verdict = !S.played.length ? "Haven't met yet"
    : lead ? `${lead} lead the season series` : "Season series level";

  const picker = (side, chosen, other) => `
    <div class="h2h-lab">${side==='a'?'Team':'Opponent'}</div>
    <div class="h2h-row">
      ${TEAMS.map(t=>`<button class="h2h-btn ${t===chosen?'on':''}" data-h${side}="${t}"
        ${t===other?'disabled':''} title="${t}" aria-label="${t}" aria-pressed="${t===chosen}">
        ${logo(t)}</button>`).join("")}
    </div>`;

  // Matrix cell = the row team's record against the column team.
  const matrix = `
  <div class="mx-wrap"><div class="mx">
    <div></div>
    ${TEAMS.map(t=>`<div class="mx-hd">${logo(t)}</div>`).join("")}
    ${TEAMS.map(r=>`
      <div class="mx-rh">${logo(r)}</div>
      ${TEAMS.map(c=>{
        if (r===c) return `<div class="mx-c self">—</div>`;
        const x = series(r,c);
        const on = (r===a&&c===b)||(r===b&&c===a);
        const txt = x.played.length ? `${x.aw}–${x.bw}` : "·";
        return `<button class="mx-c ${on?'on':''} ${x.played.length?'':'none'}"
          data-hcell="${r}|${c}" title="${r} vs ${c}: ${x.played.length?`${x.aw}–${x.bw}`:'not yet played'}">${txt}</button>`;
      }).join("")}`).join("")}
  </div></div>`;

  view.innerHTML = `
  <div style="${sectionVars(s)}">
    <div class="sec-head" style="background:${s.grad}">
      <div class="sec-eyebrow">${s.eyebrow}</div>
      <div class="sec-name">Head to Head</div>
    </div>

    ${picker('a', a, b)}
    ${picker('b', b, a)}

    <div class="h2h-head">
      <div class="h2h-side">${logo(a)}<div class="h2h-nm">${a}</div></div>
      <div class="h2h-mid">
        <div class="h2h-rec">${S.aw}–${S.bw}</div>
      </div>
      <div class="h2h-side">${logo(b)}<div class="h2h-nm">${b}</div></div>
      <div class="h2h-verd">${verdict}</div>
      ${S.played.length ? `
        <div class="h2h-agg" style="grid-column:1/-1">
          <div><div class="d-val">${S.af}</div><div class="d-label">${a} goals</div></div>
          <div><div class="d-val">${(S.af/S.played.length).toFixed(1)}–${(S.bf/S.played.length).toFixed(1)}</div><div class="d-label">Avg score</div></div>
          <div><div class="d-val">${S.bf}</div><div class="d-label">${b} goals</div></div>
        </div>` : ''}
    </div>

    ${S.played.length ? `
      <div class="kw-sub">${S.played.length===1?'The meeting':`All ${S.played.length} meetings`}</div>
      <div class="board">
        ${S.played.map(g=>{
          const aWon = g.winner===a;
          return `<div class="h2h-g">
            <div class="h2h-meta" style="text-align:left">${shortDate(g.d)}</div>
            <div class="h2h-sc">
              ${logo(a,'lg-sm')}<span class="h2h-num ${aWon?'':'h2h-dim'}">${g.af}</span>
              <span class="h2h-dim">–</span>
              <span class="h2h-num ${aWon?'h2h-dim':''}">${g.bf}</span>${logo(b,'lg-sm')}
            </div>
            <div class="h2h-meta">${g.winner} won${g.ot?' · OT':''}${g.late?'<br><span style="color:var(--accent-ink)">not yet in standings</span>':''}</div>
          </div>`;
        }).join("")}
      </div>` : `
      <div class="h2h-none">These two haven't played yet this season.</div>`}

    ${S.next.length ? `
      <div class="kw-sub">Still to come</div>
      <div class="board">
        ${S.next.map(u=>`
          <div class="h2h-g next">
            <div class="h2h-meta" style="text-align:left">${shortDate(u.d)}</div>
            <div class="h2h-sc">${logo(u.a,'lg-sm')}<span>${u.a}</span>
              <span class="h2h-dim">vs</span>${logo(u.b,'lg-sm')}<span>${u.b}</span></div>
            <div class="h2h-meta">${u.t} · ${u.tv}<br>${u.loc}</div>
          </div>`).join("")}
      </div>` : `
      <div class="note">No further meetings on the regular-season schedule.</div>`}

    <div class="kw-sub">Every series</div>
    ${matrix}
    <div class="note">
      Each cell is the row team's record against the column team — tap one to load that matchup.
      A dot means they haven't met yet. Complete through Friday, Jul 31.
    </div>
  </div>`;
}

function renderKirst(){
  const s = SECTIONS.kirst;
  const st = state.kirst;
  const pool = s.pools.find(x=>x.key===st.pool) || s.pools[0];
  const k = PLAYERS.find(p=>p.n===KIRST_NAME) || {g:0,gp:0,sh:0,shp:0,pts:0,a:0};

  const gpg      = k.gp ? k.g/k.gp : 0;
  const toTie    = Math.max(0, RECORD - k.g);
  const toBreak  = Math.max(0, RECORD + 1 - k.g);
  const left     = KIRST_SCHEDULE.length;
  const needPer  = left ? toBreak/left : 0;
  const projected= k.g + gpg*left;

  // Bar is scaled so the record sits at 82% of the track.
  const scaleMax = (RECORD+1)/0.82;
  const pos      = v => Math.min(100, (v/scaleMax)*100);

  // Projection through the remaining schedule at the selected rate.
  let run = k.g, broke = false;
  const games = KIRST_SCHEDULE.map((gm,i)=>{
    run += pool.rate;
    const shown = Math.round(run*10)/10;
    const hit = !broke && shown > RECORD;
    if (hit) broke = true;
    return {...gm, i, shown, hit};
  });
  const finishes = Math.round(run*10)/10;

  const chase = [...CHASE, {n:KIRST_NAME, yr:"2026", t:"Waterdogs", g:k.g, me:true}]
    .sort((a,b)=> b.g-a.g);

  view.innerHTML = `
  <div style="${sectionVars(s)}">
    <div class="sec-head" style="background:${s.grad}">
      <div class="sec-eyebrow">${s.eyebrow}</div>
      <div class="sec-name">Kirst Watch</div>
      <div class="head-logo">${logo("Waterdogs")}</div>
    </div>

    <div class="kw-card">
      <div class="kw-count">
        <div class="kw-num">${k.g}</div>
        <div class="kw-of">/ ${RECORD+1} to own it</div>
      </div>

      <div class="kw-track">
        <div class="kw-bar" style="width:${pos(k.g)}%"></div>
        <div class="kw-tick rec" style="left:${pos(RECORD)}%"></div>
      </div>
      <div class="kw-scale">
        <span style="left:${pos(k.g)}%">Now ${k.g}</span>
        <span style="left:${pos(RECORD)}%;color:var(--accent-ink);font-weight:700">Record ${RECORD}</span>
      </div>

      <div class="kw-lede">
        The PLL single-season goals record is <strong>${RECORD}</strong>, set by Marcus Holman with the Cannons in 2023.
        Kirst missed Philadelphia's first two games this summer while finishing an NLL title run with Toronto,
        so he's done this in ${k.gp} games. He needs <strong>${toTie}</strong> more to tie and
        <strong>${toBreak}</strong> to break it, with ${left} regular-season games left.
      </div>

      <div class="kw-grid">
        <div><div class="d-val">${toBreak}</div><div class="d-label">Goals to break</div></div>
        <div><div class="d-val">${left}</div><div class="d-label">Games left</div></div>
        <div><div class="d-val">${gpg.toFixed(2)}</div><div class="d-label">Goals / game</div></div>
        <div><div class="d-val">${needPer.toFixed(2)}</div><div class="d-label">Needed / game</div></div>
        <div><div class="d-val" style="color:var(--accent-ink)">${projected.toFixed(1)}</div><div class="d-label">Pace projection</div></div>
        <div><div class="d-val">${fmtPct(k.shp)}</div><div class="d-label">Shooting %</div></div>
        <div><div class="d-val">${k.sh}</div><div class="d-label">Shots</div></div>
        <div><div class="d-val">${k.pts}</div><div class="d-label">Points</div></div>
      </div>
    </div>

    <div class="kw-sub">Run the pace</div>
    <div class="pool-row">
      ${s.pools.map(x=>`<button class="pool-btn ${x.key===st.pool?'active':''}" data-pool="${x.key}">${x.label}${x.key==='pace'?` (${gpg.toFixed(1)})`:''}</button>`).join("")}
    </div>

    <div class="kw-sched board">
      ${games.map(g=>`
        <div class="kw-game ${g.hit?'hit':''}">
          <div style="display:flex;align-items:center;gap:12px;min-width:0">
            ${logo(g.t)}
            <div style="min-width:0">
              <div class="kw-opp">vs ${g.opp}</div>
              <div class="kw-when">${g.when} · ${g.where}</div>
            </div>
          </div>
          <div>
            <div class="kw-proj">${g.shown}</div>
            <div class="kw-flag">${g.hit ? 'Record falls' : 'Projected total'}</div>
          </div>
        </div>`).join("")}
    </div>
    <div class="note">
      At ${pool.key==='pace'?`his current ${gpg.toFixed(2)} goals per game`:pool.label.toLowerCase()},
      Kirst finishes the regular season with <strong>${finishes}</strong>${broke ? '' : ' — short of the record'}.
    </div>

    <div class="kw-sub">The list he's chasing</div>
    <div class="board kw-chase">
      ${chase.map((c,i)=>`
        <div class="row st-row ${c.me?'kw-me':''}">
          <div class="st-main">
            <div class="rank" ${c.me?'style="color:var(--accent-ink)"':''}>${i+1}</div>
            ${logo(c.t,'lg-lg')}
            <div class="who">
              <div class="gname">${c.n}</div>
              <div class="gmeta">
                <span class="tname">${c.t}</span>
                <span class="gp">${c.yr}${c.me?` · ${k.gp} games, in progress`:''}</span>
              </div>
            </div>
            <div class="st-stats">
              <div class="st-cell"><div class="st-rec" ${c.me?'style="color:var(--accent-ink)"':''}>${c.g}</div><div class="d-label">Goals</div></div>
            </div>
          </div>
          <div class="fill-track"></div>
          <div class="fill" style="width:${(c.g/(RECORD+1)*100).toFixed(1)}%"></div>
        </div>`).join("")}
    </div>
    <div class="note">
      Kirst also leads the league outright in goals this season — next closest is
      ${(()=>{const o=PLAYERS.filter(p=>p.n!==KIRST_NAME).sort((a,b)=>b.g-a.g)[0]; return `${o.n} at ${o.g}`;})()}.
      Every one of his ${k.g} goals has been a one-pointer.
    </div>
  </div>`;
}

function renderSection(key){
  if (SECTIONS[key].standings){ renderTeams(); return; }
  if (SECTIONS[key].record){ renderKirst(); return; }
  if (SECTIONS[key].h2h){ renderH2H(); return; }
  if (SECTIONS[key].rookieboard){ renderRookies(); return; }
  if (SECTIONS[key].roy){ renderROY(); return; }
  const s = SECTIONS[key];
  const st = state[key];
  const sort = s.sorts.find(x=>x.key===st.sort) || s.sorts[0];
  const pool = s.pools.find(x=>x.key===st.pool) || s.pools[0];

  let list = PLAYERS.filter(s.filter).filter(pool.f);
  if (st.team!=="all") list = list.filter(p=>p.t===st.team);
  if (sort.qual) list = list.filter(sort.qual);
  list.sort((a,b)=> sort.asc ? a[sort.key]-b[sort.key] : b[sort.key]-a[sort.key]);
  list = list.slice(0, 40);

  const vals = list.map(p=>p[sort.key]);
  const maxV = Math.max(...vals, 0.0001);
  const minV = Math.min(...vals);

  view.innerHTML = `
  <div style="${sectionVars(s)}">
    <div class="sec-head" style="background:${s.grad}">
      <div class="sec-eyebrow">${s.eyebrow}</div>
      <div class="sec-name">${s.name}</div>
    </div>

    <div class="sort-row">
      ${s.sorts.map(x=>`<button class="sort-btn ${x.key===sort.key?'active':''}" ${x.key===sort.key?`style="background:${s.grad};color:${s.activeInk}"`:''} data-sort="${x.key}">${x.label}</button>`).join("")}
    </div>

    <div class="filter-row">
      <button class="team-btn ${st.team==='all'?'active':''}" ${st.team==='all'?`style="background:${s.grad}"`:''} data-team="all" style="padding-left:13px">All teams</button>
      ${TEAMS.map(t=>`<button class="team-btn ${st.team===t?'active':''}" ${st.team===t?`style="background:${TEAM_COLORS[t]}"`:''} data-team="${t}">${logo(t,'lg-xs')}${t}</button>`).join("")}
    </div>

    <div class="pool-row">
      ${s.pools.map(x=>`<button class="pool-btn ${x.key===st.pool?'active':''}" data-pool="${x.key}">${x.label}</button>`).join("")}
    </div>

    <div class="board">
      ${list.map((p,i)=>{
        const raw = sort.asc ? (minV/Math.max(p[sort.key],0.0001)) : (p[sort.key]/maxV);
        const w = Math.max(0, Math.min(1, raw));
        return `
        <div class="row ${i===0?'top':''} ${p.n===st.open?'open':''}" tabindex="0" data-name="${p.n}">
          <div class="row-main">
            <div class="rank">${i+1}</div>
            ${avatar(p)}
            <div class="who">
              <div class="gname">${p.n}</div>
              <div class="gmeta">
                ${logo(p.t,'lg-xs')}<span class="tname">${p.t}</span>
                ${s.showPos?`<span class="pos-chip">${p.p}</span>`:''}
                ${isRookie(p)?`<span class="rk-chip" title="${rookieTag(p.n)}">Rookie</span>`:''}
                <span class="gp">${p.gp} game${p.gp===1?'':'s'}</span>
              </div>
            </div>
            <div class="stat">
              <div class="stat-val">${sort.fmt(p[sort.key])}</div>
              <div class="stat-label">${sort.unit}</div>
            </div>
          </div>
          <div class="detail">
            ${s.detail(p).map(([v,l])=>`<div><div class="d-val">${v}</div><div class="d-label">${l}</div></div>`).join("")}
            <div style="grid-column:1/-1"><a class="row-link" href="${playerHref(p.n)}">Full player page \u2192</a></div>
          </div>
          <div class="fill-track"></div>
          <div class="fill" style="width:${(w*100).toFixed(1)}%"></div>
        </div>`;
      }).join("")}
    </div>

    <div class="note">
      Tap a player for his full line.${sort.qualNote ? " " + sort.qualNote : ""}${list.length===40 ? " Showing the top 40." : ""}
    </div>
  </div>`;
}

function render(){
  const route = currentRoute();
  renderNav(route);
  if (route==="home") renderHome();
  else if (route==="player") renderPlayer(routePlayer());
  else renderSection(route);
  window.scrollTo(0,0);
}

navToggle.addEventListener("click", ()=> setNav(navMin));
if (mobileMenu) mobileMenu.addEventListener("click", ()=> setNav(navMin));
if (scrim) scrim.addEventListener("click", ()=> setNav(false));

// tapping a section in the drawer should navigate and get out of the way
document.addEventListener("click", e=>{
  if (isMobile() && !navMin && e.target.closest(".nav-link")) setNav(false);
});
document.addEventListener("keydown", e=>{
  if (e.key==="Escape" && isMobile() && !navMin) setNav(false);
});
// crossing the breakpoint shouldn't strand the drawer open or the page unscrollable
window.addEventListener("resize", ()=>{
  if (!isMobile() && document.body.style.overflow==="hidden") document.body.style.overflow="";
  if (scrim) scrim.hidden = !isMobile();
});
themeBtn.addEventListener("click", ()=>{
  theme = theme==="light" ? "dark" : "light";
  savePref("pll-theme", theme);
  applyTheme();
  render(); // re-render so per-section accent inks pick up the theme
});

document.addEventListener("click", e=>{
  const route = currentRoute();
  if (route==="player") return;
  if (route==="home") return;
  const st = state[route];
  const ts = e.target.closest("[data-tsel]");
  if (ts){
    st.sel = ts.dataset.tsel==="all" ? null : ts.dataset.tsel;
    st.open = null;
    renderSection(route);
    window.scrollTo({top:0, behavior:"smooth"});
    return;
  }
  const ha = e.target.closest("[data-ha]");
  if (ha){ if (ha.dataset.ha!==st.b) st.a = ha.dataset.ha; renderSection(route); return; }
  const hb = e.target.closest("[data-hb]");
  if (hb){ if (hb.dataset.hb!==st.a) st.b = hb.dataset.hb; renderSection(route); return; }
  const hc = e.target.closest("[data-hcell]");
  if (hc){
    const [r,c] = hc.dataset.hcell.split("|");
    st.a = r; st.b = c; renderSection(route);
    window.scrollTo({top:0, behavior:"smooth"});
    return;
  }
  const tl = e.target.closest("[data-tlog]");
  if (tl){ st.open = st.open===tl.dataset.tlog ? null : tl.dataset.tlog; renderSection(route); return; }
  const sb = e.target.closest("[data-sort]");
  if (sb){ st.sort = sb.dataset.sort; renderSection(route); return; }
  const tb = e.target.closest("[data-team]");
  if (tb){ st.team = tb.dataset.team; renderSection(route); return; }
  const pb = e.target.closest("[data-pool]");
  if (pb){ st.pool = pb.dataset.pool; st.open=null; renderSection(route); return; }
  const row = e.target.closest(".row");
  if (row && row.dataset.name){ st.open = st.open===row.dataset.name ? null : row.dataset.name; renderSection(route); }
});
document.addEventListener("keydown", e=>{
  if (e.key!=="Enter" && e.key!==" ") return;
  if (!e.target.classList || !e.target.classList.contains("row")) return;
  const route = currentRoute();
  if (route==="home" || route==="player") return;
  const st = state[route];
  const sel = e.target.dataset.tsel;
  if (sel){ e.preventDefault(); st.sel = sel==="all"?null:sel; st.open=null; renderSection(route); return; }
  const key = e.target.dataset.name;
  if (!key) return;
  e.preventDefault();
  st.open = st.open===key ? null : key;
  renderSection(route);
});
window.addEventListener("hashchange", render);

applyTheme();
applyNav();
render();
</script>
</body>
</html>
