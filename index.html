<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLL Player Stats — 2026 Season</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f6f8;
    --panel:#ffffff;
    --panel-2:#eef1f4;
    --ink:#17212b;
    --ink-soft:rgba(23,33,43,.62);
    --ink-faint:rgba(23,33,43,.4);
    --line:rgba(23,33,43,.08);
    --bar-track:rgba(23,33,43,.06);
    --nav-bg:#ffffff;
    --row-shadow:0 1px 3px rgba(23,33,43,.04);
    --focus:#17212b;
    --radius:14px;
    --nav-w:216px;
    --nav-w-min:62px;
  }
  html[data-theme="dark"]{
    --bg:#0e1215;
    --panel:#161c21;
    --panel-2:#1c242b;
    --ink:#f2f5f7;
    --ink-soft:rgba(242,245,247,.62);
    --ink-faint:rgba(242,245,247,.38);
    --line:rgba(255,255,255,.07);
    --bar-track:rgba(255,255,255,.06);
    --nav-bg:#121820;
    --row-shadow:none;
    --focus:#f2f5f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}

  /* ---- Side nav ---- */
  .sidenav{
    position:fixed;top:0;left:0;bottom:0;z-index:20;
    width:var(--nav-w);
    background:var(--nav-bg);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    padding:14px 10px;
    transition:width .2s ease;
    overflow:hidden;
  }
  body.nav-min .sidenav{width:var(--nav-w-min)}

  .nav-top{display:flex;align-items:center;gap:8px;margin-bottom:14px;min-height:42px}
  .nav-toggle{
    flex:0 0 42px;height:42px;border-radius:10px;border:none;background:transparent;
    color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .nav-toggle:hover{background:var(--panel-2);color:var(--ink)}
  .nav-toggle:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .nav-brand{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;opacity:1;transition:opacity .15s;
  }
  body.nav-min .nav-brand{opacity:0;pointer-events:none}

  .nav-links{display:flex;flex-direction:column;gap:4px;flex:1}
  .nav-link{
    display:flex;align-items:center;gap:12px;
    padding:11px 11px;border-radius:10px;
    color:var(--ink-soft);font-size:14px;font-weight:600;
    white-space:nowrap;position:relative;
  }
  .nav-link:hover{background:var(--panel-2);color:var(--ink)}
  .nav-link:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .nav-link.here{color:var(--ink);background:var(--panel-2)}
  .nav-link.here::before{
    content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;
    background:var(--here-grad,var(--ink));
  }
  .nav-ico{
    flex:0 0 22px;height:22px;display:flex;align-items:center;justify-content:center;
  }
  .nav-ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nav-label{opacity:1;transition:opacity .15s}
  body.nav-min .nav-label{opacity:0;pointer-events:none}

  .theme-btn{
    display:flex;align-items:center;gap:12px;
    padding:11px;border-radius:10px;border:none;background:transparent;cursor:pointer;
    color:var(--ink-soft);font-size:14px;font-weight:600;white-space:nowrap;text-align:left;
  }
  .theme-btn:hover{background:var(--panel-2);color:var(--ink)}
  .theme-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .theme-btn .nav-ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* ---- Main ---- */
  .main{
    margin-left:var(--nav-w);
    padding:28px 20px 64px;
    transition:margin-left .2s ease;
  }
  body.nav-min .main{margin-left:var(--nav-w-min)}
  .wrap{max-width:880px;margin:0 auto}

  .page-title{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;
    letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:24px;
  }

  /* ---- Hub tiles ---- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .tile{
    border-radius:18px;min-height:230px;display:flex;flex-direction:column;justify-content:flex-end;
    padding:24px;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .18s;color:#fff;
  }
  .tile:hover{transform:translateY(-3px)}
  .tile:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .tile-eyebrow{font-size:14px;font-weight:500;opacity:.85;margin-bottom:6px}
  .tile-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:46px;line-height:1;text-transform:uppercase;letter-spacing:.02em}

  /* ---- Section header ---- */
  .sec-head{border-radius:18px;padding:22px 24px;margin-bottom:22px;color:#fff}
  .sec-eyebrow{font-size:13px;font-weight:500;opacity:.85}
  .sec-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:38px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;margin-top:4px}

  /* ---- Controls ---- */
  .sort-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .sort-btn{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase;
    padding:12px 18px;border-radius:10px;border:1px solid var(--line);cursor:pointer;
    background:var(--panel);color:var(--ink-soft);transition:background .15s,color .15s;
  }
  .sort-btn:hover{background:var(--panel-2);color:var(--ink)}
  .sort-btn.active{border-color:transparent;box-shadow:0 4px 18px var(--glow)}
  .sort-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  .filter-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .team-btn{
    display:inline-flex;align-items:center;gap:7px;
    font-size:12px;font-weight:600;padding:6px 13px 6px 7px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);transition:all .15s;
  }
  .team-btn:hover{color:var(--ink)}
  .team-btn.active{color:#fff;border-color:transparent}
  .team-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  .pool-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
  .pool-btn{
    font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);transition:all .15s;
  }
  .pool-btn:hover{color:var(--ink)}
  .pool-btn.active{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
  .pool-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  /* ---- Rows ---- */
  .board{display:flex;flex-direction:column;gap:10px}
  .row{
    background:var(--panel);border-radius:var(--radius);padding:16px 18px;cursor:pointer;
    position:relative;overflow:hidden;transition:background .15s;
    border:1px solid var(--line);box-shadow:var(--row-shadow);
  }
  .row:hover{background:var(--panel-2)}
  .row:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .row.top{border-color:var(--accent-line)}

  .row-main{display:grid;grid-template-columns:34px 34px 1fr auto;gap:12px;align-items:center;position:relative;z-index:1}
  .rank{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;color:var(--ink-faint);text-align:center}
  .row.top .rank{color:var(--accent-ink)}
  .who{min-width:0}
  .gname{font-weight:600;font-size:16.5px;line-height:1.2}
  .gmeta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
  .team-chip{font-size:11px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:6px;color:#fff}
  .pos-chip{font-size:11px;font-weight:600;letter-spacing:.05em;padding:3px 8px;border-radius:6px;background:var(--panel-2);color:var(--ink-soft)}
  .gp{font-size:12px;color:var(--ink-faint)}
  .stat{text-align:right}
  .stat-val{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
  .row.top .stat-val{color:var(--accent-ink)}
  .stat-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:4px}

  .fill-track{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--bar-track)}
  .fill{position:absolute;left:0;bottom:0;height:4px;background:var(--accent-grad);border-radius:0 3px 3px 0;transition:width .5s cubic-bezier(.22,1,.36,1)}

  .detail{
    display:none;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
    grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px;
  }
  .row.open .detail{display:grid}
  .d-val{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
  .d-label{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px}

  /* ---- Standings ---- */
  .conf-title{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-soft);margin:22px 0 10px;
  }
  .conf-title:first-of-type{margin-top:0}
  .st-row{cursor:default}
  .st-row:hover{background:var(--panel)}
  .st-main{display:grid;grid-template-columns:26px 46px 1fr auto;gap:12px;align-items:center;position:relative;z-index:1}
  .st-stats{display:flex;gap:20px;align-items:baseline;text-align:right}
  .st-rec{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
  .st-cell{min-width:44px}
  .st-cell .d-val{font-size:19px}
  .sd-pos{color:var(--sd-pos,#1d7a3e)}
  .sd-neg{color:var(--sd-neg,#c22e2e)}
  html[data-theme="dark"]{--sd-pos:#4fc276;--sd-neg:#f0716a}

  .note{margin-top:22px;font-size:12.5px;color:var(--ink-faint);line-height:1.5}

  /* ---- Logos ---- */
  .lg{width:34px;height:34px;border-radius:50%;object-fit:contain;display:block;flex:0 0 auto}
  .lg-lg{width:46px;height:46px}
  .lg-sm{width:26px;height:26px}
  .lg-xs{width:19px;height:19px}
  .tname{font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--ink-soft)}
  .tile-logos{display:flex;gap:5px;margin-bottom:12px}
  .tile-logos .lg{width:27px;height:27px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .head-logo{position:absolute;right:20px;top:50%;transform:translateY(-50%);opacity:.9}
  .head-logo .lg{width:64px;height:64px}
  .sec-head{position:relative}

  /* ---- Team game log ---- */
  .form{display:flex;gap:3px;margin-top:7px}
  .pip{width:15px;height:5px;border-radius:3px;background:var(--bar-track)}
  .pip-w{background:var(--sd-pos,#1d7a3e)}
  .pip-l{background:var(--sd-neg,#c22e2e)}
  .st-row{cursor:pointer}
  .st-row:hover{background:var(--panel-2)}
  .gl{display:none;margin-top:15px;padding-top:6px;border-top:1px solid var(--line);flex-direction:column}
  .row.open .gl{display:flex}
  .gl-g{display:grid;grid-template-columns:60px 24px 1fr auto;gap:11px;align-items:center;
    padding:10px 2px;border-bottom:1px solid var(--line)}
  .gl-g:last-of-type{border-bottom:none}
  .gl-d{font-size:11.5px;color:var(--ink-faint);white-space:nowrap}
  .gl-r{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;
    width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff}
  .gl-w{background:var(--sd-pos,#1d7a3e)}
  .gl-l{background:var(--sd-neg,#c22e2e)}
  .gl-o{display:flex;align-items:center;gap:9px;min-width:0;font-size:14.5px;font-weight:600}
  .gl-o span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gl-s{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .gl-ot{font-size:9.5px;letter-spacing:.07em;color:var(--ink-faint);margin-left:5px}
  .gl-sum{display:flex;gap:20px;flex-wrap:wrap;padding:12px 2px 2px;font-size:12px;color:var(--ink-faint)}
  .gl-sum b{font-family:'Barlow Condensed',sans-serif;font-size:16px;color:var(--ink);font-weight:700}

  /* ---- Record watch ---- */
  .kw-card{background:var(--panel);border:1px solid var(--accent-line);border-radius:18px;padding:24px;box-shadow:var(--row-shadow)}
  .kw-count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .kw-num{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:84px;line-height:.85;color:var(--accent-ink);font-variant-numeric:tabular-nums}
  .kw-of{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:28px;color:var(--ink-faint);letter-spacing:.03em}
  .kw-lede{font-size:14px;color:var(--ink-soft);line-height:1.55;margin-top:12px}
  .kw-track{position:relative;height:16px;border-radius:9px;background:var(--bar-track);margin:22px 0 9px}
  .kw-bar{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--accent-grad)}
  .kw-tick{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink-faint);border-radius:2px}
  .kw-tick.rec{background:var(--accent-ink)}
  .kw-scale{position:relative;height:16px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}
  .kw-scale span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
  .kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:14px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
  .kw-grid .d-val{font-size:27px}
  .kw-sub{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-soft);margin:30px 0 11px}
  .kw-game{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;
    display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;box-shadow:var(--row-shadow)}
  .kw-game.hit{border-color:var(--accent-line);background:var(--accent-soft)}
  .kw-opp{font-weight:600;font-size:16px}
  .kw-when{font-size:12px;color:var(--ink-faint);margin-top:5px}
  .kw-proj{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;line-height:1;
    font-variant-numeric:tabular-nums;text-align:right}
  .kw-game.hit .kw-proj{color:var(--accent-ink)}
  .kw-flag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:5px;text-align:right}
  .kw-chase .gname{font-size:16px}
  .kw-me{border-color:var(--accent-line);background:var(--accent-soft)}
  /* ---- Scoreboard strip ---- */
  .sb{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
  .sb-g{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;
    display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:center;box-shadow:var(--row-shadow)}
  .sb-side{display:flex;align-items:center;gap:7px}
  .sb-d{font-size:11.5px;color:var(--ink-faint);letter-spacing:.03em}
  .sb-m{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .sb-w{font-weight:700}
  .sb-l{color:var(--ink-soft);font-weight:500}
  .sb-t{font-size:12px;color:var(--ink-faint);font-weight:600;white-space:nowrap}
  @media(max-width:560px){
    .kw-num{font-size:62px}.kw-of{font-size:22px}
    .sb-g{grid-template-columns:1fr;gap:5px}
  }

  @media(max-width:760px){
    body{--nav-w:216px}
    body:not(.nav-open) .sidenav{width:var(--nav-w-min)}
    body:not(.nav-open) .nav-label, body:not(.nav-open) .nav-brand{opacity:0;pointer-events:none}
    .main{margin-left:var(--nav-w-min) !important;padding:22px 14px 56px}
    body.nav-open .sidenav{width:var(--nav-w);box-shadow:0 0 40px rgba(0,0,0,.3)}
  }
  @media(max-width:560px){
    .stat-val{font-size:25px}.rank{font-size:21px}
    .sort-btn{padding:10px 14px;font-size:15px}
    .tile{min-height:170px}.tile-name{font-size:36px}
    .st-cell{min-width:38px}.st-rec{font-size:23px}
    .st-stats{gap:12px}
    .st-main{grid-template-columns:22px 38px 1fr auto;gap:9px}
    .row-main{grid-template-columns:28px 30px 1fr auto;gap:10px}
    .lg{width:30px;height:30px}.lg-lg{width:38px;height:38px}
    .head-logo .lg{width:46px;height:46px}
    .gl-g{grid-template-columns:52px 22px 1fr auto;gap:8px}
    .st-hide-sm{display:none}
  }

  @media(prefers-reduced-motion:reduce){
    .fill{transition:none}.tile{transition:none}.sidenav{transition:none}.main{transition:none}
  }
</style>
</head>
<body>
<nav class="sidenav" id="sidenav" aria-label="Sections">
  <div class="nav-top">
    <button class="nav-toggle" id="navToggle" aria-label="Collapse navigation">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="nav-brand">PLL 2026</div>
  </div>
  <div class="nav-links" id="navLinks"></div>
  <button class="theme-btn" id="themeBtn">
    <span class="nav-ico" id="themeIco"></span>
    <span class="nav-label" id="themeLabel">Dark mode</span>
  </button>
</nav>

<div class="main">
  <div class="wrap" id="view"></div>

// Every game a team has played, oldest first, from that team's point of view.
function teamGames(team){
  return GAMES.filter(g=>g.w===team||g.l===team).map(g=>{
    const won = g.w===team;
    return {d:g.d, won, opp:won?g.l:g.w, gf:won?g.ws:g.ls, ga:won?g.ls:g.ws, ot:!!g.ot};
  });
}

// ---- Preferences (theme + nav), guarded so they degrade gracefully ----
function loadPref(key, fallback){
  try{ const v = localStorage.getItem(key); return v===null ? fallback : v; }catch(e){ return fallback; }
}
function savePref(key, val){
  try{ localStorage.setItem(key, val); }catch(e){}
}

let theme = loadPref("pll-theme","light");
let navMin = loadPref("pll-nav","open")==="min";

const view = document.getElementById("view");
const navLinks = document.getElementById("navLinks");
const themeBtn = document.getElementById("themeBtn");
const themeIco = document.getElementById("themeIco");
const themeLabel = document.getElementById("themeLabel");
const navToggle = document.getElementById("navToggle");

function applyTheme(){
  document.documentElement.setAttribute("data-theme", theme);
  themeIco.innerHTML = theme==="light" ? ICONS.moon : ICONS.sun;
  themeLabel.textContent = theme==="light" ? "Dark mode" : "Light mode";
}
function applyNav(){
  document.body.classList.toggle("nav-min", navMin);
  // mobile uses nav-open to expand the rail as an overlay
  document.body.classList.toggle("nav-open", !navMin);
  navToggle.setAttribute("aria-label", navMin ? "Expand navigation" : "Collapse navigation");
}

function accentInk(s){ return theme==="dark" ? s.accentDark : s.accent; }

function currentRoute(){
  const h = (location.hash||"#home").slice(1);
  return SECTIONS[h] ? h : "home";
}

function renderNav(route){
  const items = [{key:"home",name:"Home",ico:"home",grad:null}]
    .concat(ORDER.map(k=>({key:k,name:SECTIONS[k].name,ico:SECTIONS[k].ico,grad:SECTIONS[k].grad})));
  navLinks.innerHTML = items.map(it=>`
    <a class="nav-link ${route===it.key?'here':''}" href="#${it.key}" ${it.grad&&route===it.key?`style="--here-grad:${it.grad}"`:''} title="${it.name}">
      <span class="nav-ico">${ICONS[it.ico]}</span>
      <span class="nav-label">${it.name}</span>
    </a>`).join("");
}

function renderHome(){
  view.innerHTML = `
    <div class="page-title">PLL Player Stats — 2026 Season</div>
    <div class="tiles">
      ${ORDER.map(k=>{
        const s = SECTIONS[k];
        const count = s.standings ? "8 teams"
          : s.tileNote ? s.tileNote
          : PLAYERS.filter(s.filter).length + " players";
        return `<a class="tile" href="#${k}" style="background:${s.grad};box-shadow:0 8px 30px ${s.glow}">
          ${k==="teams" ? `<div class="tile-logos">${TEAMS.map(t=>logo(t)).join("")}</div>`
            : k==="kirst" ? `<div class="tile-logos">${logo("Waterdogs")}</div>` : ''}
          <div class="tile-eyebrow">${count}</div>
          <div class="tile-name">${s.name}</div>
        </a>`;
      }).join("")}
    </div>`;
}

function gameLog(team){
  const gs = teamGames(team);
  const gf = gs.reduce((n,g)=>n+g.gf,0), ga = gs.reduce((n,g)=>n+g.ga,0);
  return `<div class="gl">
    ${gs.map(g=>`
      <div class="gl-g">
        <div class="gl-d">${shortDate(g.d)}</div>
        <div class="gl-r ${g.won?'gl-w':'gl-l'}">${g.won?'W':'L'}</div>
        <div class="gl-o">${logo(g.opp,'lg-sm')}<span>${g.opp}</span></div>
        <div class="gl-s">${g.gf}\u2013${g.ga}${g.ot?'<span class="gl-ot">OT</span>':''}</div>
      </div>`).join("")}
    <div class="gl-sum">
      <div><b>${gs.length}</b> played</div>
      <div><b>${(gf/gs.length).toFixed(1)}</b> scored / game</div>
      <div><b>${(ga/gs.length).toFixed(1)}</b> allowed / game</div>
    </div>
  </div>`;
}

function standingsRows(rows, open){
  return `<div class="board">` + rows.map((t,i)=>{
    const sdCls = t.sd>0?"sd-pos":(t.sd<0?"sd-neg":"");
    const wp = (t.w+t.l)>0 ? t.w/(t.w+t.l) : 0;
    const form = teamGames(t.team);
    return `
    <div class="row st-row ${i===0?'top':''} ${open===t.team?'open':''}" tabindex="0"
         data-tlog="${t.team}" aria-expanded="${open===t.team}">
      <div class="st-main">
        <div class="rank">${i+1}</div>
        ${logo(t.team,'lg-lg')}
        <div class="who">
          <div class="gname">${t.city} ${t.team}</div>
          <div class="form" title="Oldest result on the left">
            ${form.map(g=>`<span class="pip ${g.won?'pip-w':'pip-l'}"></span>`).join("")}
          </div>
        </div>
        <div class="st-stats">
          <div class="st-cell"><div class="st-rec">${t.w}–${t.l}</div><div class="d-label">W–L</div></div>
          <div class="st-cell st-hide-sm"><div class="d-val">${t.s}</div><div class="d-label">Scores</div></div>
          <div class="st-cell st-hide-sm"><div class="d-val">${t.sa}</div><div class="d-label">Against</div></div>
          <div class="st-cell"><div class="d-val ${sdCls}">${t.sd>0?'+':''}${t.sd}</div><div class="d-label">Diff</div></div>
        </div>
      </div>
      ${gameLog(t.team)}
      <div class="fill-track"></div>
      <div class="fill" style="width:${(wp*100).toFixed(1)}%"></div>
    </div>`;
  }).join("") + `</div>`;
}

function sectionVars(s){
  return `--accent-ink:${accentInk(s)};--accent-soft:${s.accentSoft};--accent-line:${s.accentLine};--accent-grad:${s.grad};--glow:${s.glow}`;
}

  </div>`;

function renderKirst(){
  const s = SECTIONS.kirst;
  const st = state.kirst;
  const pool = s.pools.find(x=>x.key===st.pool) || s.pools[0];
  const k = PLAYERS.find(p=>p.n===KIRST_NAME) || {g:0,gp:0,sh:0,shp:0,pts:0,a:0};

  const gpg      = k.gp ? k.g/k.gp : 0;
  const toTie    = Math.max(0, RECORD - k.g);
  const toBreak  = Math.max(0, RECORD + 1 - k.g);
  const left     = KIRST_SCHEDULE.length;
  const needPer  = left ? toBreak/left : 0;
  const projected= k.g + gpg*left;

  // Bar is scaled so the record sits at 82% of the track.
  const scaleMax = (RECORD+1)/0.82;
  const pos      = v => Math.min(100, (v/scaleMax)*100);

  // Projection through the remaining schedule at the selected rate.
  let run = k.g, broke = false;
  const games = KIRST_SCHEDULE.map((gm,i)=>{
    run += pool.rate;
    const shown = Math.round(run*10)/10;
    const hit = !broke && shown > RECORD;
    if (hit) broke = true;
    return {...gm, i, shown, hit};
  });
  const finishes = Math.round(run*10)/10;

  const chase = [...CHASE, {n:KIRST_NAME, yr:"2026", t:"Waterdogs", g:k.g, me:true}]
    .sort((a,b)=> b.g-a.g);

  view.innerHTML = `
  <div style="${sectionVars(s)}">
    <div class="sec-head" style="background:${s.grad}">
      <div class="sec-eyebrow">${s.eyebrow}</div>
      <div class="sec-name">Kirst Watch</div>
      <div class="head-logo">${logo("Waterdogs")}</div>
    </div>

    <div class="kw-card">
      <div class="kw-count">
        <div class="kw-num">${k.g}</div>
        <div class="kw-of">/ ${RECORD+1} to own it</div>
      </div>

      <div class="kw-track">
        <div class="kw-bar" style="width:${pos(k.g)}%"></div>
        <div class="kw-tick rec" style="left:${pos(RECORD)}%"></div>
      </div>
      <div class="kw-scale">
        <span style="left:${pos(k.g)}%">Now ${k.g}</span>
        <span style="left:${pos(RECORD)}%;color:var(--accent-ink);font-weight:700">Record ${RECORD}</span>
      </div>

      <div class="kw-lede">
        The PLL single-season goals record is <strong>${RECORD}</strong>, set by Marcus Holman with the Cannons in 2023.
        Kirst missed Philadelphia's first two games this summer while finishing an NLL title run with Toronto,
        so he's done this in ${k.gp} games. He needs <strong>${toTie}</strong> more to tie and
        <strong>${toBreak}</strong> to break it, with ${left} regular-season games left.
      </div>

      <div class="kw-grid">
        <div><div class="d-val">${toBreak}</div><div class="d-label">Goals to break</div></div>
        <div><div class="d-val">${left}</div><div class="d-label">Games left</div></div>
        <div><div class="d-val">${gpg.toFixed(2)}</div><div class="d-label">Goals / game</div></div>
        <div><div class="d-val">${needPer.toFixed(2)}</div><div class="d-label">Needed / game</div></div>
        <div><div class="d-val" style="color:var(--accent-ink)">${projected.toFixed(1)}</div><div class="d-label">Pace projection</div></div>
        <div><div class="d-val">${fmtPct(k.shp)}</div><div class="d-label">Shooting %</div></div>
        <div><div class="d-val">${k.sh}</div><div class="d-label">Shots</div></div>
        <div><div class="d-val">${k.pts}</div><div class="d-label">Points</div></div>
      </div>
    </div>

    <div class="kw-sub">Run the pace</div>
    <div class="pool-row">
      ${s.pools.map(x=>`<button class="pool-btn ${x.key===st.pool?'active':''}" data-pool="${x.key}">${x.label}${x.key==='pace'?` (${gpg.toFixed(1)})`:''}</button>`).join("")}
    </div>

    <div class="kw-sched board">
      ${games.map(g=>`
        <div class="kw-game ${g.hit?'hit':''}">
          <div style="display:flex;align-items:center;gap:12px;min-width:0">
            ${logo(g.t)}
            <div style="min-width:0">
              <div class="kw-opp">vs ${g.opp}</div>
              <div class="kw-when">${g.when} · ${g.where}</div>
            </div>
          </div>
          <div>
            <div class="kw-proj">${g.shown}</div>
            <div class="kw-flag">${g.hit ? 'Record falls' : 'Projected total'}</div>
          </div>
        </div>`).join("")}
    </div>
    <div class="note">
      At ${pool.key==='pace'?`his current ${gpg.toFixed(2)} goals per game`:pool.label.toLowerCase()},
      Kirst finishes the regular season with <strong>${finishes}</strong>${broke ? '' : ' — short of the record'}.
    </div>

    <div class="kw-sub">The list he's chasing</div>
    <div class="board kw-chase">
      ${chase.map((c,i)=>`
        <div class="row st-row ${c.me?'kw-me':''}">
          <div class="st-main">
            <div class="rank" ${c.me?'style="color:var(--accent-ink)"':''}>${i+1}</div>
            ${logo(c.t,'lg-lg')}
            <div class="who">
              <div class="gname">${c.n}</div>
              <div class="gmeta">
                <span class="tname">${c.t}</span>
                <span class="gp">${c.yr}${c.me?` · ${k.gp} games, in progress`:''}</span>
              </div>
            </div>
            <div class="st-stats">
              <div class="st-cell"><div class="st-rec" ${c.me?'style="color:var(--accent-ink)"':''}>${c.g}</div><div class="d-label">Goals</div></div>
            </div>
          </div>
          <div class="fill-track"></div>
          <div class="fill" style="width:${(c.g/(RECORD+1)*100).toFixed(1)}%"></div>
        </div>`).join("")}
    </div>
    <div class="note">
      Kirst also leads the league outright in goals this season — next closest is
      ${(()=>{const o=PLAYERS.filter(p=>p.n!==KIRST_NAME).sort((a,b)=>b.g-a.g)[0]; return `${o.n} at ${o.g}`;})()}.
      Every one of his ${k.g} goals has been a one-pointer.
    </div>
  </div>`;
}

function renderSection(key){
  if (SECTIONS[key].standings){ renderTeams(); return; }
  if (SECTIONS[key].record){ renderKirst(); return; }
  const s = SECTIONS[key];
  const st = state[key];
  const sort = s.sorts.find(x=>x.key===st.sort) || s.sorts[0];
  const pool = s.pools.find(x=>x.key===st.pool) || s.pools[0];

  let list = PLAYERS.filter(s.filter).filter(pool.f);
  if (st.team!=="all") list = list.filter(p=>p.t===st.team);
  if (sort.qual) list = list.filter(sort.qual);
  list.sort((a,b)=> sort.asc ? a[sort.key]-b[sort.key] : b[sort.key]-a[sort.key]);
  list = list.slice(0, 40);

  const vals = list.map(p=>p[sort.key]);
  const maxV = Math.max(...vals, 0.0001);
  const minV = Math.min(...vals);

  view.innerHTML = `
  <div style="${sectionVars(s)}">
    <div class="sec-head" style="background:${s.grad}">
      <div class="sec-eyebrow">${s.eyebrow}</div>
      <div class="sec-name">${s.name}</div>
    </div>

    <div class="sort-row">
      ${s.sorts.map(x=>`<button class="sort-btn ${x.key===sort.key?'active':''}" ${x.key===sort.key?`style="background:${s.grad};color:${s.activeInk}"`:''} data-sort="${x.key}">${x.label}</button>`).join("")}
    </div>

    <div class="filter-row">
      <button class="team-btn ${st.team==='all'?'active':''}" ${st.team==='all'?`style="background:${s.grad}"`:''} data-team="all" style="padding-left:13px">All teams</button>
      ${TEAMS.map(t=>`<button class="team-btn ${st.team===t?'active':''}" ${st.team===t?`style="background:${TEAM_COLORS[t]}"`:''} data-team="${t}">${logo(t,'lg-xs')}${t}</button>`).join("")}
    </div>

    <div class="pool-row">
      ${s.pools.map(x=>`<button class="pool-btn ${x.key===st.pool?'active':''}" data-pool="${x.key}">${x.label}</button>`).join("")}
    </div>

    <div class="board">
      ${list.map((p,i)=>{
        const raw = sort.asc ? (minV/Math.max(p[sort.key],0.0001)) : (p[sort.key]/maxV);
        const w = Math.max(0, Math.min(1, raw));
        return `
        <div class="row ${i===0?'top':''} ${p.n===st.open?'open':''}" tabindex="0" data-name="${p.n}">
          <div class="row-main">
            <div class="rank">${i+1}</div>
            ${logo(p.t)}
            <div class="who">
              <div class="gname">${p.n}</div>
              <div class="gmeta">
                <span class="tname">${p.t}</span>
                ${s.showPos?`<span class="pos-chip">${p.p}</span>`:''}
                <span class="gp">${p.gp} game${p.gp===1?'':'s'}</span>
              </div>
            </div>
            <div class="stat">
              <div class="stat-val">${sort.fmt(p[sort.key])}</div>
              <div class="stat-label">${sort.unit}</div>
            </div>
          </div>
          <div class="detail">
            ${s.detail(p).map(([v,l])=>`<div><div class="d-val">${v}</div><div class="d-label">${l}</div></div>`).join("")}
          </div>
          <div class="fill-track"></div>
          <div class="fill" style="width:${(w*100).toFixed(1)}%"></div>
        </div>`;
      }).join("")}
    </div>

    <div class="note">
      Tap a player for his full line.${sort.qualNote ? " " + sort.qualNote : ""}${list.length===40 ? " Showing the top 40." : ""}
    </div>
  </div>`;
}

function render(){
  const route = currentRoute();
  renderNav(route);
  if (route==="home") renderHome();
  else renderSection(route);
  window.scrollTo(0,0);
}

navToggle.addEventListener("click", ()=>{
  navMin = !navMin;
  savePref("pll-nav", navMin ? "min" : "open");
  applyNav();
});
themeBtn.addEventListener("click", ()=>{
  theme = theme==="light" ? "dark" : "light";
  savePref("pll-theme", theme);
  applyTheme();
  render(); // re-render so per-section accent inks pick up the theme
});

document.addEventListener("click", e=>{
  const route = currentRoute();
  if (route==="home") return;
  const st = state[route];
  const tl = e.target.closest("[data-tlog]");
  if (tl){ st.open = st.open===tl.dataset.tlog ? null : tl.dataset.tlog; renderSection(route); return; }
  const sb = e.target.closest("[data-sort]");
  if (sb){ st.sort = sb.dataset.sort; renderSection(route); return; }
  const tb = e.target.closest("[data-team]");
  if (tb){ st.team = tb.dataset.team; renderSection(route); return; }
  const pb = e.target.closest("[data-pool]");
  if (pb){ st.pool = pb.dataset.pool; st.open=null; renderSection(route); return; }
  const row = e.target.closest(".row");
  if (row && row.dataset.name){ st.open = st.open===row.dataset.name ? null : row.dataset.name; renderSection(route); }
});
document.addEventListener("keydown", e=>{
  if (e.key!=="Enter" && e.key!==" ") return;
  if (!e.target.classList || !e.target.classList.contains("row")) return;
  const key = e.target.dataset.name || e.target.dataset.tlog;
  if (!key) return;
  const route = currentRoute();
  if (route==="home") return;
  e.preventDefault();
  const st = state[route];
  st.open = st.open===key ? null : key;
  renderSection(route);
});
window.addEventListener("hashchange", render);

applyTheme();
applyNav();
render();
</script>
</body>
</html>
